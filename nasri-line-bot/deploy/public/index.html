<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<title>Nasri — Enervia AI Office</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Sarabun', sans-serif; background: #1a1a2e; color: #f0e68c; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #16213e; border: 1px solid #f0e68c33; border-radius: 16px; padding: 48px; max-width: 480px; text-align: center; }
  h1 { font-size: 2rem; margin-bottom: 8px; }
  .sub { color: #aaa; font-size: 0.9rem; margin-bottom: 24px; }
  .status { background: #0f3460; border-radius: 8px; padding: 16px; margin-top: 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; background: #4ade80; border-radius: 50%; margin-right: 8px; }
  a { color: #f0e68c; }
</style>
</head>
<body>
<div class="card">
  <h1>Nasri Butler</h1>
  <div class="sub">Enervia Group AI Office</div>
  <p>At your service, sir.</p>
  <div class="status">
    <span class="dot"></span> LINE Bot Online
  </div>
  <p style="margin-top:16px; font-size: 0.8rem; color: #666;">
    Powered by Oracle &bull; <a href="/health">Health Check</a>
  </p>
</div>
</body>
</html>
