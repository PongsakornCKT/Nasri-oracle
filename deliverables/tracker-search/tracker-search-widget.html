<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Search & Filter Overlay (Ctrl+K) Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c9a84c;
      --gold-dim: #8a6f2e;
      --gold-glow: rgba(201,168,76,0.15);
      --bg: #0d0d0d;
      --bg2: #141414;
      --bg3: #1c1c1c;
      --bg4: #242424;
      --border: rgba(201,168,76,0.2);
      --border-hover: rgba(201,168,76,0.4);
      --text: #e8e0d0;
      --text-dim: #888888;
      --green: #4caf7d;
      --yellow: #f0c040;
      --red: #e05252;
      --blue: #5b9cf6;
      --purple: #a57cf0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .demo-header {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 24px;
    }

    .demo-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Header Search Trigger Button ── */
    .btn-search-trigger {
      background: rgba(201, 168, 76, 0.08);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-search-trigger:hover {
      background: rgba(201, 168, 76, 0.16);
      border-color: var(--gold);
      color: var(--text);
    }

    .kbd-badge {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--gold);
    }

    /* ── Search Modal Overlay ── */
    .search-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      padding-top: 80px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .search-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .search-modal {
      width: 100%;
      max-width: 620px;
      background: var(--bg2);
      border: 1px solid var(--border-hover);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(201, 168, 76, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 520px;
      transform: translateY(-10px);
      transition: transform 0.2s ease;
    }

    .search-overlay.active .search-modal {
      transform: translateY(0);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .search-icon {
      font-size: 16px;
      color: var(--gold);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
    }

    .search-input::placeholder { color: var(--text-dim); }

    .category-pills {
      display: flex;
      gap: 6px;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.2);
    }

    .cat-pill {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cat-pill.active {
      background: var(--gold-glow);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 700;
    }

    .results-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .result-item:hover, .result-item.selected {
      background: var(--bg3);
      border-color: var(--border);
    }

    .result-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .result-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .result-sub {
      font-size: 10px;
      color: var(--text-dim);
    }

    .result-badge {
      font-size: 9px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .result-badge.gold { background: rgba(201, 168, 76, 0.15); color: var(--gold); }
    .result-badge.green { background: rgba(76, 175, 125, 0.15); color: var(--green); }
    .result-badge.yellow { background: rgba(240, 192, 64, 0.15); color: var(--yellow); }
    .result-badge.purple { background: rgba(165, 124, 240, 0.15); color: var(--purple); }
    .result-badge.blue { background: rgba(91, 156, 246, 0.15); color: var(--blue); }

    .search-footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
    }

    .empty-state {
      padding: 32px 18px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="demo-header">
    <div class="demo-title">
      <span>𓂀 Oracle Tracker</span>
    </div>
    <button class="btn-search-trigger" onclick="openSearchModal()">
      <span>🔍 Search Tracker...</span>
      <span class="kbd-badge">Ctrl + K</span>
    </button>
  </div>

  <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">
    Press <strong style="color:var(--gold)">Ctrl + K</strong> (or Cmd+K) anywhere on page to trigger Global Search
  </div>

  <!-- Search Modal Overlay -->
  <div class="search-overlay" id="searchModalOverlay" onclick="handleOverlayClick(event)">
    <div class="search-modal">
      
      <div class="search-input-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search Projects, Milestones, Proposals, Agents..." oninput="handleSearchInput()" />
        <span class="kbd-badge">ESC</span>
      </div>

      <div class="category-pills">
        <button class="cat-pill active" onclick="setCategory('all', this)">All</button>
        <button class="cat-pill" onclick="setCategory('projects', this)">Projects</button>
        <button class="cat-pill" onclick="setCategory('milestones', this)">Milestones</button>
        <button class="cat-pill" onclick="setCategory('proposals', this)">Proposals</button>
        <button class="cat-pill" onclick="setCategory('agents', this)">Agents</button>
      </div>

      <div class="results-list" id="resultsList">
        <!-- Results dynamically populated -->
      </div>

      <div class="search-footer">
        <span>Use <strong>↑</strong> <strong>↓</strong> to navigate, <strong>Enter</strong> to select</span>
        <span id="resultsCount">0 items matched</span>
      </div>

    </div>
  </div>

  <script>
    // Fallback Data for Search
    const DATABASE = [
      { id: "p-1", category: "project", title: "Oracle Work Tracker", subtitle: "Work tracker & proposal execution system", badge: "PROJECT", badgeColor: "gold", type: "projects" },
      { id: "p-2", category: "project", title: "MAW Office Dashboard", subtitle: "Fleet management & monitoring office", badge: "PROJECT", badgeColor: "gold", type: "projects" },
      { id: "m-1", category: "milestone", title: "Global Search & Filter Overlay (#2)", subtitle: "Project: Oracle Tracker", badge: "ACTIVE", badgeColor: "yellow", type: "milestones" },
      { id: "m-2", category: "milestone", title: "System Health Widget (#41)", subtitle: "Project: MAW Office", badge: "DONE", badgeColor: "green", type: "milestones" },
      { id: "m-3", category: "milestone", title: "Fleet Heartbeat Probe (#22)", subtitle: "Project: MAW Office", badge: "DONE", badgeColor: "green", type: "milestones" },
      { id: "m-4", category: "milestone", title: "Worktree Drift Counter (#19)", subtitle: "Project: MAW Office", badge: "DONE", badgeColor: "green", type: "milestones" },
      { id: "m-5", category: "milestone", title: "Task Claiming & Locking Board (#27)", subtitle: "Project: MAW Office", badge: "DONE", badgeColor: "green", type: "milestones" },
      { id: "pr-1", category: "proposal", title: "Batch Execute Selected Proposals (#4)", subtitle: "Proposed by nasri-oracle", badge: "PROPOSAL", badgeColor: "purple", type: "proposals" },
      { id: "pr-2", category: "proposal", title: "Real-Time Active Execution Stream (#7)", subtitle: "Proposed by pa-oracle", badge: "PROPOSAL", badgeColor: "purple", type: "proposals" },
      { id: "a-1", category: "agent", title: "nasri-oracle", subtitle: "Executive Secretary (Right Hand of Ma'at)", badge: "SECRETARY", badgeColor: "blue", type: "agents" },
      { id: "a-2", category: "agent", title: "pa-oracle", subtitle: "Lead Orchestrator (Eye of Ma'at)", badge: "SECRETARY", badgeColor: "blue", type: "agents" },
      { id: "a-3", category: "agent", title: "horus", subtitle: "Lead Engineer", badge: "ENGI", badgeColor: "blue", type: "agents" }
    ];

    let activeCategory = 'all';
    let selectedIndex = 0;
    let filteredResults = [];

    function openSearchModal() {
      const overlay = document.getElementById('searchModalOverlay');
      overlay.classList.add('active');
      const input = document.getElementById('searchInput');
      input.value = '';
      input.focus();
      handleSearchInput();
    }

    function closeSearchModal() {
      const overlay = document.getElementById('searchModalOverlay');
      overlay.classList.remove('active');
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'searchModalOverlay') {
        closeSearchModal();
      }
    }

    function setCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      handleSearchInput();
    }

    function handleSearchInput() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      filteredResults = DATABASE.filter(item => {
        const matchesCat = activeCategory === 'all' || item.type === activeCategory;
        const matchesText = !q || item.title.toLowerCase().includes(q) || item.subtitle.toLowerCase().includes(q);
        return matchesCat && matchesText;
      });

      selectedIndex = 0;
      renderResults();
    }

    function renderResults() {
      const listEl = document.getElementById('resultsList');
      const countEl = document.getElementById('resultsCount');
      listEl.innerHTML = '';

      countEl.textContent = `${filteredResults.length} items matched`;

      if (filteredResults.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No matching items found</div>';
        return;
      }

      filteredResults.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = `result-item ${index === selectedIndex ? 'selected' : ''}`;
        row.onclick = () => selectItem(item);

        row.innerHTML = `
          <div class="result-left">
            <div class="result-title">${item.title}</div>
            <div class="result-sub">${item.subtitle}</div>
          </div>
          <span class="result-badge ${item.badgeColor}">${item.badge}</span>
        `;
        listEl.appendChild(row);
      });
    }

    function selectItem(item) {
      alert(`Navigating to: ${item.title}`);
      closeSearchModal();
    }

    // Keyboard Listeners
    window.addEventListener('keydown', (e) => {
      // Ctrl+K or Cmd+K
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
        return;
      }

      const overlay = document.getElementById('searchModalOverlay');
      if (!overlay.classList.contains('active')) return;

      if (e.key === 'Escape') {
        closeSearchModal();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (filteredResults.length > 0) {
          selectedIndex = (selectedIndex + 1) % filteredResults.length;
          renderResults();
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (filteredResults.length > 0) {
          selectedIndex = (selectedIndex - 1 + filteredResults.length) % filteredResults.length;
          renderResults();
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (filteredResults[selectedIndex]) {
          selectItem(filteredResults[selectedIndex]);
        }
      }
    });
  </script>
</body>
</html>
