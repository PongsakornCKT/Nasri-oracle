<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Agent Heartbeat & Liveness Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #04040a;
      --card-bg: #0a0a14;
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.22);
      --gold: #f59e0b;
      --green: #22c55e;
      --green-glow: 0 0 6px rgba(34, 197, 94, 0.6);
      --amber: #f59e0b;
      --amber-glow: 0 0 6px rgba(245, 158, 11, 0.6);
      --red: #ef4444;
      --red-glow: 0 0 6px rgba(239, 68, 68, 0.6);
      --text: #f3f4f6;
      --text-dim: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans Thai Looped', system-ui, -apple-system, sans-serif;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .widget-card {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badges-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 700;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid transparent;
    }

    .badge.active { background: rgba(34, 197, 94, 0.12); color: var(--green); border-color: rgba(34, 197, 94, 0.3); }
    .badge.silent { background: rgba(245, 158, 11, 0.12); color: var(--amber); border-color: rgba(245, 158, 11, 0.3); }
    .badge.stale { background: rgba(239, 68, 68, 0.12); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      font-family: inherit;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-refresh:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }

    .room-section {
      margin-top: 14px;
    }

    .room-label {
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .agent-grid {
      display: grid;
      grid-cols-1;
      gap: 6px;
    }

    @media (min-width: 480px) {
      .agent-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .agent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .agent-row:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border-hover);
    }

    .agent-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    /* ── CRITICAL: Genuine CSS Circle Dot ── */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.active { background: var(--green); box-shadow: var(--green-glow); }
    .status-dot.silent { background: var(--amber); box-shadow: var(--amber-glow); }
    .status-dot.stale { background: var(--red); box-shadow: var(--red-glow); }

    .agent-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      truncate: true;
    }

    .agent-role {
      font-size: 9px;
      color: var(--text-dim);
    }

    .agent-right {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      text-align: right;
      flex-shrink: 0;
    }

    .time-active { color: var(--green); }
    .time-silent { color: var(--amber); }
    .time-stale { color: var(--red); }

    .card-footer {
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
    }
  </style>
</head>
<body>

  <div class="widget-card">
    <div class="card-header">
      <div class="card-title">
        <span>💓 Fleet Agent Liveness</span>
        <div class="badges-group">
          <span class="badge active" id="badgeActive">0 ACTIVE</span>
          <span class="badge silent" id="badgeSilent">0 SILENT</span>
          <span class="badge stale" id="badgeStale">0 STALE</span>
        </div>
      </div>
      <button class="btn-refresh" onclick="manualRefresh()">
        <span id="spinIcon">↻</span> Refresh
      </button>
    </div>

    <!-- Rooms List -->
    <div id="roomsContainer"></div>

    <!-- Footer -->
    <div class="card-footer">
      <span>Auto-polling every 15s</span>
      <span id="lastUpdated">Checking...</span>
    </div>
  </div>

  <script>
    const MOCK_SUMMARY = {
      agents: [
        { name: "pa-oracle", role: "Eye of Ma'at / Lead", room: "secretary", status: "active", lastSeenMsAgo: 60000, lastSeenIso: new Date().toISOString() },
        { name: "nasri-oracle", role: "Right Hand of Ma'at", room: "secretary", status: "active", lastSeenMsAgo: 5000, lastSeenIso: new Date().toISOString() },
        { name: "horus", role: "Engineering Lead", room: "engi", status: "active", lastSeenMsAgo: 120000, lastSeenIso: new Date().toISOString() },
        { name: "imhotep", role: "System Architect", room: "engi", status: "silent", lastSeenMsAgo: 450000, lastSeenIso: new Date().toISOString() },
        { name: "ptah", role: "Core Builder", room: "engi", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" },
        { name: "seshat", role: "Docs & Spec Specialist", room: "engi", status: "active", lastSeenMsAgo: 180000, lastSeenIso: new Date().toISOString() },
        { name: "ra", role: "Deploy Pipeline Lead", room: "engi", status: "silent", lastSeenMsAgo: 600000, lastSeenIso: new Date().toISOString() },
        { name: "thoth", role: "Knowledge & Memory", room: "engi", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" },
        { name: "anubis", role: "Security & Audit", room: "engi", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" },
        { name: "bastet", role: "QA & Test Automation", room: "engi", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" },
        { name: "isis", role: "Domain Specialist", room: "engi", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" },
        { name: "khnum", role: "Infra & Environment", room: "engi", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" },
        { name: "sekhmet", role: "Reliability & Guard", room: "engi", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" },
        { name: "sobek", role: "Data & DB Specialist", room: "engi", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" },
        { name: "zeus", role: "Research Lead", room: "research", status: "active", lastSeenMsAgo: 240000, lastSeenIso: new Date().toISOString() },
        { name: "athena", role: "Strategy Scout", room: "research", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" },
        { name: "hermes", role: "Network & Intel", room: "research", status: "stale", lastSeenMsAgo: -1, lastSeenIso: "Never" }
      ],
      total: 17,
      active: 4,
      silent: 2,
      stale: 11,
      checkedAt: new Date().toISOString()
    };

    function formatAgo(msAgo) {
      if (!msAgo || msAgo < 0) return 'Stale (never)';
      const sec = Math.floor(msAgo / 1000);
      if (sec < 60) return `${sec}s ago`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hr = Math.floor(min / 60);
      return `${hr}h ago`;
    }

    let currentData = MOCK_SUMMARY;

    function render() {
      if (!currentData || !currentData.agents) return;

      document.getElementById('badgeActive').textContent = `${currentData.active || 0} ACTIVE`;
      document.getElementById('badgeSilent').textContent = `${currentData.silent || 0} SILENT`;
      document.getElementById('badgeStale').textContent = `${currentData.stale || 0} STALE`;

      const rooms = { secretary: 'Secretary Room', engi: 'Engineering Team', research: 'Research Team' };
      const container = document.getElementById('roomsContainer');
      container.innerHTML = '';

      Object.entries(rooms).forEach(([roomKey, roomLabel]) => {
        const roomAgents = currentData.agents.filter(a => a.room === roomKey);
        if (roomAgents.length === 0) return;

        const secEl = document.createElement('div');
        secEl.className = 'room-section';
        secEl.innerHTML = `
          <div class="room-label">📡 ${roomLabel} (${roomAgents.filter(a => a.status === 'active').length}/${roomAgents.length} Active)</div>
          <div class="agent-grid" id="grid-${roomKey}"></div>
        `;
        container.appendChild(secEl);

        const gridEl = secEl.querySelector(`#grid-${roomKey}`);
        roomAgents.forEach(a => {
          const row = document.createElement('div');
          row.className = 'agent-row';
          const timeClass = a.status === 'active' ? 'time-active' : a.status === 'silent' ? 'time-silent' : 'time-stale';
          row.innerHTML = `
            <div class="agent-left">
              <div class="status-dot ${a.status}" title="${a.status}"></div>
              <div>
                <div class="agent-name">${a.name}</div>
                <div class="agent-role">${a.role}</div>
              </div>
            </div>
            <div class="agent-right ${timeClass}">${formatAgo(a.lastSeenMsAgo)}</div>
          `;
          gridEl.appendChild(row);
        });
      });

      const updated = currentData.checkedAt ? new Date(currentData.checkedAt).toTimeString().split(' ')[0] : '--:--:--';
      document.getElementById('lastUpdated').textContent = `Updated ${updated}`;
    }

    async function fetchHeartbeat(forceRefresh = false) {
      try {
        const url = `/api/fleet/heartbeat${forceRefresh ? '?refresh=1' : ''}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        currentData = await res.json();
      } catch (err) {
        currentData = MOCK_SUMMARY;
        currentData.checkedAt = new Date().toISOString();
      } finally {
        render();
      }
    }

    async function manualRefresh() {
      const icon = document.getElementById('spinIcon');
      icon.style.transform = 'rotate(360deg)';
      icon.style.transition = 'transform 0.5s ease';
      await fetchHeartbeat(true);
      setTimeout(() => { icon.style.transform = 'none'; icon.style.transition = 'none'; }, 500);
    }

    fetchHeartbeat();
    setInterval(fetchHeartbeat, 15000);
  </script>
</body>
</html>
