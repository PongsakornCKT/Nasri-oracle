<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worktree Drift & Uncommitted Changes Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #04040a;
      --card-bg: #0a0a14;
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.22);
      --gold: #f59e0b;
      --green: #22c55e;
      --green-glow: 0 0 6px rgba(34, 197, 94, 0.6);
      --amber: #f59e0b;
      --amber-glow: 0 0 6px rgba(245, 158, 11, 0.6);
      --red: #ef4444;
      --red-glow: 0 0 6px rgba(239, 68, 68, 0.6);
      --text: #f3f4f6;
      --text-dim: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans Thai Looped', system-ui, -apple-system, sans-serif;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .widget-card {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-group {
      display: flex;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 700;
    }

    .summary-pill {
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid transparent;
    }

    .summary-pill.clean { background: rgba(34, 197, 94, 0.12); color: var(--green); border-color: rgba(34, 197, 94, 0.3); }
    .summary-pill.drift { background: rgba(245, 158, 11, 0.12); color: var(--amber); border-color: rgba(245, 158, 11, 0.3); }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      font-family: inherit;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-refresh:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }

    .wt-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .wt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .wt-row:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border-hover);
    }

    .wt-row.drifted {
      background: rgba(245, 158, 11, 0.03);
      border-color: rgba(245, 158, 11, 0.2);
    }

    .wt-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    /* ── CRITICAL: Genuine CSS Circle Dot ── */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.clean { background: var(--green); box-shadow: var(--green-glow); }
    .status-dot.drifted { background: var(--amber); box-shadow: var(--amber-glow); }

    .wt-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .wt-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .wt-branch {
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-dim);
    }

    .wt-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
    }

    .drift-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .drift-pill.clean { background: rgba(34, 197, 94, 0.1); color: var(--green); }
    .drift-pill.drifted { background: rgba(245, 158, 11, 0.15); color: var(--amber); }

    .commit-time {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .card-footer {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
    }
  </style>
</head>
<body>

  <div class="widget-card">
    <div class="card-header">
      <div class="card-title">
        <span>🍂 Active Worktree Drift</span>
        <div class="summary-group">
          <span class="summary-pill clean" id="pillClean">0 Clean</span>
          <span class="summary-pill drift" id="pillDrift">0 Drifted</span>
        </div>
      </div>
      <button class="btn-refresh" onclick="manualRefresh()">
        <span id="spinIcon">↻</span> Refresh
      </button>
    </div>

    <!-- Worktrees List -->
    <div class="wt-list" id="wtList">
      <!-- Dynamic Rows -->
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <span>Auto-polling every 10s • Cache TTL 10s</span>
      <span id="lastUpdated">Checking...</span>
    </div>
  </div>

  <script>
    // Fallback Mock Data for local preview (file://)
    const MOCK_DATA = {
      worktrees: [
        { name: "pa-oracle-wt-tracker-exec", path: "/mnt/c/Users/pO-Ch/Documents/GitHub/pa-oracle-wt-tracker-exec", branch: "feat/tracker-execute", repo: "pa-Oracle v2", status: "active", uncommittedCount: 0, lastCommitAgeSec: 300, hasDrift: false },
        { name: "nasri-oracle", path: "/mnt/c/Users/pO-Ch/Documents/GitHub/nasri-oracle", branch: "master", repo: "nasri-oracle", status: "active", uncommittedCount: 12, lastCommitAgeSec: 680, hasDrift: true }
      ],
      total: 2,
      cleanCount: 1,
      driftCount: 1,
      totalUncommittedFiles: 12,
      checkedAt: new Date().toISOString()
    };

    function formatRelativeAge(ageSec) {
      if (ageSec === null || ageSec === undefined) return 'ไม่ทราบเวลา';
      if (ageSec < 10) return 'เมื่อครู่';
      if (ageSec < 60) return `${ageSec} วินาทีที่แล้ว`;
      const min = Math.floor(ageSec / 60);
      if (min < 60) return `${min} นาทีที่แล้ว`;
      const hr = Math.floor(min / 60);
      return `${hr} ชั่วโมงที่แล้ว`;
    }

    let currentData = MOCK_DATA;

    function render() {
      if (!currentData || !currentData.worktrees) return;

      document.getElementById('pillClean').textContent = `${currentData.cleanCount || 0} Clean`;
      document.getElementById('pillDrift').textContent = `${currentData.driftCount || 0} Drifted (${currentData.totalUncommittedFiles || 0} files)`;

      const listEl = document.getElementById('wtList');
      listEl.innerHTML = '';

      currentData.worktrees.forEach(w => {
        const row = document.createElement('div');
        row.className = `wt-row ${w.hasDrift ? 'drifted' : ''}`;

        const dotClass = `status-dot ${w.hasDrift ? 'drifted' : 'clean'}`;
        const pillClass = `drift-pill ${w.hasDrift ? 'drifted' : 'clean'}`;
        const pillText = w.hasDrift ? `⚠️ ${w.uncommittedCount} uncommitted files` : '✓ Clean';

        row.innerHTML = `
          <div class="wt-left">
            <div class="${dotClass}"></div>
            <div class="wt-info">
              <div class="wt-name">${w.name}</div>
              <div class="wt-branch">🌿 ${w.branch}</div>
            </div>
          </div>
          <div class="wt-right">
            <span class="${pillClass}">${pillText}</span>
            <span class="commit-time">Commit ${formatRelativeAge(w.lastCommitAgeSec)}</span>
          </div>
        `;
        listEl.appendChild(row);
      });

      const updated = currentData.checkedAt ? new Date(currentData.checkedAt).toTimeString().split(' ')[0] : '--:--:--';
      document.getElementById('lastUpdated').textContent = `Updated ${updated}`;
    }

    async function fetchDriftData(forceRefresh = false) {
      try {
        const url = `/api/worktrees/drift${forceRefresh ? '?refresh=1' : ''}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        currentData = await res.json();
      } catch (err) {
        currentData = MOCK_DATA;
        currentData.checkedAt = new Date().toISOString();
      } finally {
        render();
      }
    }

    async function manualRefresh() {
      const icon = document.getElementById('spinIcon');
      icon.style.transform = 'rotate(360deg)';
      icon.style.transition = 'transform 0.5s ease';
      await fetchDriftData(true);
      setTimeout(() => { icon.style.transform = 'none'; icon.style.transition = 'none'; }, 500);
    }

    fetchDriftData();
    setInterval(fetchDriftData, 10000);
  </script>
</body>
</html>
