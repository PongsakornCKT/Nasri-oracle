<!-- ================================================================= -->
<!-- Tracker Phase 2: Real-Time Execution Progress & Console Stream    -->
<!-- Deliverable Block for oracle-studio/tracker.html                  -->
<!-- ================================================================= -->

<style>
  .exec-progress-card {
    margin: 0 0 14px;
    padding: 12px 16px;
    background: rgba(201, 168, 76, 0.04);
    border: 1px solid rgba(201, 168, 76, 0.22);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }

  .exec-progress-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .exec-progress-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--gold, #c9a84c);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .exec-progress-agent-badge {
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(91, 156, 246, 0.15);
    color: var(--blue, #5b9cf6);
    border: 1px solid rgba(91, 156, 246, 0.3);
  }

  .exec-progress-step-text {
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim, #888);
  }

  /* ── Animated Progress Bar ── */
  .exec-progress-track {
    height: 6px;
    background: var(--bg4, #242424);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .exec-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold, #c9a84c) 0%, var(--green, #4caf7d) 100%);
    border-radius: 4px;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px rgba(76, 175, 125, 0.5);
  }

  /* ── Live Console Log Stream ── */
  .exec-console-stream {
    background: var(--bg, #0d0d0d);
    border: 1px solid var(--border, rgba(201,168,76,0.2));
    border-radius: 6px;
    padding: 8px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text, #e8e0d0);
    max-height: 80px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .exec-log-line {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }

  .exec-log-line.latest {
    color: var(--green, #4caf7d);
    font-weight: 600;
  }
</style>

<!-- Real-Time Active Execution Container -->
<div id="execProgressStreamBar" class="exec-progress-card" style="display:none;">
  <div class="exec-progress-header">
    <div class="exec-progress-title">
      <span>⚡ Active Execution Stream</span>
      <span id="execAgentBadge" class="exec-progress-agent-badge">nasri-oracle</span>
    </div>
    <span id="execStepText" class="exec-progress-step-text">Step 0/0 (0%)</span>
  </div>

  <div id="execTaskTitle" style="font-size:11.5px;font-weight:600;color:var(--text,#e8e0d0)">
    Task Execution Title
  </div>

  <!-- Progress Bar -->
  <div class="exec-progress-track">
    <div id="execProgressFill" class="exec-progress-fill" style="width: 0%;"></div>
  </div>

  <!-- Console Log Terminal Stream -->
  <div id="execConsoleStream" class="exec-console-stream">
    <div class="exec-log-line latest">[Live Log] Initializing execution context...</div>
  </div>
</div>

<script>
(function() {
  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Standalone Mock Execution Simulator (used when no active execution from API)
  let mockStep = 0;
  const MOCK_STEPS = [
    { step: 1, total: 4, pct: 25, log: "Parsing task requirements and isolating worktree...", agent: "nasri-oracle" },
    { step: 2, total: 4, pct: 50, log: "Running zero-dependency vitest probes (6/6 pass)...", agent: "nasri-oracle" },
    { step: 3, total: 4, pct: 75, log: "Generating clean surgical patch and verification diff...", agent: "nasri-oracle" },
    { step: 4, total: 4, pct: 100, log: "Execution complete! Verification clean & delivered via maw", agent: "nasri-oracle" }
  ];

  async function pollExecutionProgress() {
    let executions = [];
    try {
      const apiHost = typeof TRACKER_API !== 'undefined' ? TRACKER_API : '';
      const res = await fetch(apiHost + '/api/tracker/active-executions');
      if (res.ok) {
        const data = await res.json();
        executions = data.executions || [];
      }
    } catch {}

    const container = document.getElementById('execProgressStreamBar');
    if (!container) return;

    if (executions.length > 0) {
      const active = executions.find(e => e.status === 'running') || executions[0];
      renderExecutionUI(active);
      container.style.display = 'flex';
    } else {
      // Standalone Preview Simulation Mode
      mockStep = (mockStep % MOCK_STEPS.length) + 1;
      const stepData = MOCK_STEPS[mockStep - 1];
      renderExecutionUI({
        taskTitle: "Phase 2: Real-Time Execution Progress (#7)",
        agent: stepData.agent,
        currentStep: stepData.step,
        totalSteps: stepData.total,
        progressPercent: stepData.pct,
        logs: [
          `[${new Date().toTimeString().split(' ')[0]}] ${stepData.log}`
        ]
      });
      container.style.display = 'flex';
    }
  }

  function renderExecutionUI(item) {
    const agentBadge = document.getElementById('execAgentBadge');
    const stepText = document.getElementById('execStepText');
    const taskTitle = document.getElementById('execTaskTitle');
    const fill = document.getElementById('execProgressFill');
    const consoleBox = document.getElementById('execConsoleStream');

    if (agentBadge) agentBadge.textContent = escHtml(item.agent || 'nasri-oracle');
    if (stepText) stepText.textContent = `Step ${item.currentStep}/${item.totalSteps} (${item.progressPercent}%)`;
    if (taskTitle) taskTitle.textContent = escHtml(item.taskTitle || 'Task Execution');
    if (fill) fill.style.width = `${item.progressPercent}%`;

    if (consoleBox && item.logs) {
      consoleBox.innerHTML = '';
      item.logs.forEach((logLine, idx) => {
        const line = document.createElement('div');
        line.className = `exec-log-line ${idx === item.logs.length - 1 ? 'latest' : ''}`;
        line.textContent = escHtml(logLine);
        consoleBox.appendChild(line);
      });
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }
  }

  // Poll every 3 seconds
  pollExecutionProgress();
  setInterval(pollExecutionProgress, 3000);
})();
</script>
